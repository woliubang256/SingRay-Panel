server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    # Docker 内置 DNS。配合下面的变量写法做"启动后解析":
    # panel 容器重启换 IP 时不会像 upstream 块那样把旧 IP 缓存到 nginx 进程里。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $panel_upstream "http://panel:3000";

    # ---- 前端静态资源:Vite 产物带内容 hash,可长期缓存 ----
    location /assets/ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---- 订阅端点:每次拉取必须回源,且响应含节点凭据,禁止任何缓存 ----
    location /sub/ {
        proxy_pass         $panel_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header         Cache-Control "no-store" always;
    }

    # ---- API ----
    location /api/ {
        proxy_pass         $panel_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 部署/安装核心会长时间占住连接(SSH 侧超时最长 300s)
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering    off;
    }

    # ---- SPA:createBrowserRouter 需要 history 回退 ----
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 必须不缓存,否则前端发版后客户端仍加载旧 hash 资源
        add_header Cache-Control "no-cache" always;
    }
}

name: publish-image

# 触发:推 main / 打 v* 标签 / 手动。产出两个镜像到 GHCR:
#   ghcr.io/<owner>/singray-panel-server:<tag>
#   ghcr.io/<owner>/singray-panel-web:<tag>
# 只改业务代码时走 type=sha 的 tag, 打标签发版才有语义化版本号。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 同一 ref 只保留最新一次发布, 避免连续提交堆积构建
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # 发布前的门禁:类型检查 + 全量测试(含 golden 快照) + 服务端镜像启动检查。
  # 不通过就根本不产生镜像, 避免把坏版本推进 registry。
  verify:
    name: 类型检查、测试与镜像启动检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建服务端检查镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: singray-panel-server:smoke
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: 启动镜像并检查 /health
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach \
            --env PANEL_JWT_SECRET="$(openssl rand -hex 32)" \
            --env PANEL_APP_SECRET="$(openssl rand -hex 32)" \
            --env PANEL_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            --health-interval=2s \
            --health-timeout=3s \
            --health-start-period=0s \
            --health-retries=15 \
            singray-panel-server:smoke)
          trap 'docker logs "$container_id" || true; docker rm -f "$container_id" >/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$status" = healthy ]; then
              echo "服务端镜像启动成功,/health 检查通过"
              exit 0
            fi
            if [ "$status" = unhealthy ] || [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              echo "服务端镜像启动或 /health 检查失败" >&2
              exit 1
            fi
            sleep 2
          done
          echo "等待服务端镜像 /health 超时" >&2
          exit 1

  publish:
    name: 构建并推送 ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 对应 Dockerfile 的两个 target
        target: [server, web]
    steps:
      - uses: actions/checkout@v4

      # 目标机可能是 x86 VPS 或 Oracle/Ampere 这类 arm64, 两个架构都出
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action 会把 owner/repo 统一转小写, 与 compose 里的默认镜像名对齐
      - name: 生成 tag 与 label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 分层缓存, 第二次构建基本只重跑 tsc/vite
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: 写入发布摘要
        run: |
          {
            echo "### ${{ matrix.target }} 已发布"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
